name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Explicitly bash: GitHub then runs it with -eo pipefail, so a failure piped into `tee`
# fails the step instead of vanishing.
defaults:
  run:
    shell: bash

# The swarmsim commit the lab is tested against. Moving it is a change like any other:
# the tests say what the new commit broke. `uses:` cannot read an expression, so the
# scenarios job repeats it.
env:
  SWARMSIM_REF: da0c6514b17ee7ab5b5a4f659f091bc64c6de831

jobs:
  tests:
    name: Lint & test (pytest against swarmsim)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The checkout is for swarmsim's scenarios, which are not part of its package, and the
      # runner is installed from it, as any other repository can (EXPERIMENTS.md, F2).
      - uses: actions/checkout@v7
        with:
          repository: konradcinkusz/swarmsim
          ref: ${{ env.SWARMSIM_REF }}
          path: swarmsim

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install swarmsim's runner and the lab's dependencies
        run: pip install ./swarmsim/swarm_coordination -r requirements-dev.txt

      - name: ruff
        run: ruff check . && ruff format --check .

      - name: pytest
        run: pytest -v

  scenarios:
    name: Lab scenarios on LabSwarm (swarmsim's Action)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The same check any repository can run on its own swarm: the scenarios fly inside
      # this job, and nothing is sent anywhere. LabSwarm is held to its own expectations
      # (F4), and the mutation check runs on the lab's mutants (F1): every scenario must
      # fail one, every mutant must fail a scenario.
      - name: The lab's scenarios, with its expectations and its mutants
        uses: konradcinkusz/swarmsim@da0c6514b17ee7ab5b5a4f659f091bc64c6de831
        with:
          scenarios: scenarios
          sut: lab_swarm.swarm:LabSwarm
          expect: expectations/lab.yaml
          mutants-from: lab_swarm.mutants:MUTANTS
          seeds: "3"

      # swarmsim's own scenarios, which the action carries (F5), on LabSwarm: all but the
      # one that jams its leader (F11), which expectations/lab.yaml writes down.
      - name: swarmsim's scenarios on LabSwarm
        uses: konradcinkusz/swarmsim@da0c6514b17ee7ab5b5a4f659f091bc64c6de831
        with:
          scenarios: ""
          include-swarmsim-scenarios: "true"
          sut: lab_swarm.swarm:LabSwarm
          expect: expectations/lab.yaml
          seeds: "3"
          junit-path: swarmsim-scenarios-on-lab.xml

  compare:
    name: Reference vs LabSwarm, compared by SwarmApi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/checkout@v7
        with:
          repository: konradcinkusz/swarmsim
          ref: ${{ env.SWARMSIM_REF }}
          path: swarmsim

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install swarmsim's runner
        run: pip install ./swarmsim/swarm_coordination pyyaml jsonschema

      # Open mode, runs kept in memory: a throwaway API that lives as long as this job.
      - name: Start SwarmApi
        run: |
          dotnet run --project swarmsim/backend/src/SwarmApi.Api \
            --urls http://127.0.0.1:5080 > api.log 2>&1 &
          for _ in $(seq 1 100); do  # the first run restores and builds: allow 5 minutes
            if curl -fsS http://127.0.0.1:5080/health; then exit 0; fi
            sleep 3
          done
          cat api.log
          exit 1

      - name: Store both runs and compare them
        run: |
          {
            echo "## Reference vs LabSwarm (SwarmApi's comparison)"
            echo
            python -m tools.compare_swarms --api http://127.0.0.1:5080 \
              --base reference --base-expect expectations/reference.yaml \
              --head lab_swarm.swarm:LabSwarm --head-expect expectations/lab.yaml \
              --seeds 3 scenarios swarmsim/scenarios
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: swarm-comparison
          path: reports/
