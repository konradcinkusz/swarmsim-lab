version: 1
name: v_after_lanes
description: >
  Three drones fly lanes. 11 s in, a V formation mission supersedes the lanes in mid-air,
  so the V forms from a moving row rather than from the pads.
drones: 3
duration_s: 100
events:
  - at_s: 1
    mission: {type: waypoint, waypoints: [[0, 0, 5], [30, 0, 5]], drone_count: 3, spacing_m: 3}
  - at_s: 12
    mission: {type: formation, formation: v, waypoints: [[20, 0, 6], [60, 0, 6]], drone_count: 3, spacing_m: 3}
assertions:
  - min_separation: {min_m: 2.0}
  - mission_completes: {within_s: 80}
