version: 1
name: line_five_noisy_gps
description: Five drones form a line from their pads with 1 m of GPS noise on every axis.
drones: 5
duration_s: 90
world: {gps_noise_std_m: 1.0}
events:
  - at_s: 1
    mission: {type: formation, formation: line, waypoints: [[0, 0, 6], [40, 0, 6]], drone_count: 5, spacing_m: 3}
assertions:
  - min_separation: {min_m: 2.0}
  - mission_completes: {within_s: 80}
